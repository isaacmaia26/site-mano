<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFF6E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Missão Estudo">
<title>Missão Estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF6E8;
  --ink: #1A1A2E;
  --orange: #FF6B35;
  --green: #06A77D;
  --yellow: #FFD23F;
  --pink: #F4A6A0;
  --blue: #4361EE;
  --purple: #9D4EDD;
  --shadow: 6px 6px 0 var(--ink);
  --shadow-sm: 4px 4px 0 var(--ink);
  --shadow-pressed: 2px 2px 0 var(--ink);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, textarea, select {
  font-family: inherit;
  font-size: 16px; /* prevent iOS zoom */
}

.display { font-family: 'Fraunces', serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.display-italic { font-style: italic; }

#app {
  min-height: 100vh;
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 20px 100px;
  position: relative;
}

@media (min-width: 700px) {
  #app { padding: 32px 24px 100px; }
}

/* ============= VIEW: LOADING ============= */
.loading-screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}

.spinner {
  width: 40px; height: 40px;
  border: 4px solid var(--ink);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ============= BUTTONS ============= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 24px;
  border-radius: 18px;
  font-weight: 700;
  font-size: 16px;
  transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.2s;
  border: 2px solid var(--ink);
  width: 100%;
}

.btn:active { transform: translate(3px, 3px); box-shadow: var(--shadow-pressed) !important; }

.btn-primary {
  background: var(--orange);
  color: white;
  box-shadow: var(--shadow);
}

.btn-primary:hover { background: var(--ink); }

.btn-dark {
  background: var(--ink);
  color: var(--bg);
  box-shadow: var(--shadow);
}

.btn-dark:hover { background: var(--orange); }

.btn-green {
  background: var(--green);
  color: white;
  box-shadow: var(--shadow);
}

.btn-green:hover { background: var(--ink); }

.btn-yellow {
  background: var(--yellow);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  color: rgba(26, 26, 46, 0.6);
  padding: 8px 0;
  border: none;
  width: auto;
  box-shadow: none;
  background: none;
}

.btn-ghost:hover { color: var(--ink); }

.btn-icon {
  width: 44px; height: 44px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  border: 2px solid var(--ink);
  background: white;
}

/* ============= CARDS ============= */
.card {
  background: white;
  border: 2px solid rgba(26, 26, 46, 0.12);
  border-radius: 20px;
  padding: 18px;
}

.card-bold {
  background: white;
  border: 4px solid var(--ink);
  border-radius: 24px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.card-dark {
  background: var(--ink);
  color: var(--bg);
  border-radius: 24px;
  padding: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: 6px 6px 0 var(--orange);
}

.card-dark::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  background: rgba(255, 107, 53, 0.25);
  border-radius: 50%;
  filter: blur(40px);
}

/* ============= ONBOARDING ============= */
.onboarding {
  min-height: 80vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.onboarding-inner {
  width: 100%;
  max-width: 420px;
  animation: fadeIn 0.4s ease-out;
}

.onboarding-hero {
  text-align: center;
  margin-bottom: 24px;
}

.onboarding-emoji { font-size: 64px; margin-bottom: 12px; }

.onboarding h1 { font-size: clamp(40px, 10vw, 52px); margin-bottom: 16px; }

.onboarding p { color: rgba(26, 26, 46, 0.7); font-size: 17px; line-height: 1.5; margin-bottom: 28px; }

.input-field {
  width: 100%;
  background: white;
  border: 2px solid var(--ink);
  border-radius: 18px;
  padding: 16px 20px;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  outline: none;
}

.input-field:focus { box-shadow: 0 0 0 4px var(--yellow); }

.input-label { font-weight: 600; margin-bottom: 10px; display: block; }

.year-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}

.year-btn {
  padding: 16px;
  border-radius: 16px;
  border: 2px solid rgba(26, 26, 46, 0.2);
  background: white;
  font-weight: 700;
  font-size: 16px;
  transition: all 0.15s;
}

.year-btn:hover { border-color: var(--ink); }

.year-btn.active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

/* ============= HOME ============= */
.home-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
}

.greeting-label { color: rgba(26, 26, 46, 0.6); font-size: 14px; }

.greeting-name { font-size: 38px; margin-top: 2px; }

.xp-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  color: var(--yellow);
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 14px;
}

.big-cta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--orange);
  color: white;
  padding: 24px;
  border-radius: 24px;
  margin-bottom: 16px;
  border: 2px solid var(--ink);
  box-shadow: var(--shadow);
  transition: background 0.2s, transform 0.1s, box-shadow 0.1s;
  width: 100%;
  text-align: left;
}

.big-cta:hover { background: var(--ink); }
.big-cta:active { transform: translate(3px, 3px); box-shadow: var(--shadow-pressed); }

.big-cta-title { font-family: 'Fraunces', serif; font-weight: 800; font-size: 26px; line-height: 1.1; margin-bottom: 4px; }
.big-cta-sub { font-size: 14px; opacity: 0.85; }

.big-cta-icon {
  width: 56px; height: 56px;
  background: white;
  color: var(--orange);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
  flex-shrink: 0;
  margin-left: 12px;
}

.big-cta:hover .big-cta-icon { transform: rotate(12deg); }

.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 24px;
}

.stat-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.05em;
  font-weight: 700;
  color: rgba(26, 26, 46, 0.6);
  margin-bottom: 4px;
}

.stat-card-green {
  background: var(--green);
  color: white;
  border-radius: 18px;
  padding: 16px;
  text-align: left;
  border: none;
  transition: background 0.2s;
}

.stat-card-green:hover { background: var(--ink); }
.stat-card-green .stat-label { color: rgba(255, 255, 255, 0.85); }

.stat-value { font-family: 'Fraunces', serif; font-weight: 800; font-size: 30px; }

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: 22px;
  margin: 24px 0 12px;
}

.weak-topic {
  background: rgba(255, 107, 53, 0.1);
  border: 2px solid rgba(255, 107, 53, 0.3);
  border-radius: 16px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.weak-topic-name { font-weight: 600; font-size: 15px; flex: 1; padding-right: 8px; }
.weak-topic-count { background: white; color: var(--orange); font-weight: 700; font-size: 11px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

.test-item {
  background: white;
  border: 2px solid rgba(26, 26, 46, 0.1);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
  transition: border-color 0.15s;
}

.test-item:hover { border-color: var(--ink); }

.test-emoji-box {
  width: 48px; height: 48px;
  background: var(--yellow);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}

.test-info { flex: 1; min-width: 0; }
.test-title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.test-meta { font-size: 12px; color: rgba(26, 26, 46, 0.6); margin-top: 2px; }

.empty-state { text-align: center; padding: 32px 16px; }
.empty-emoji { font-size: 56px; margin-bottom: 12px; }
.empty-text { color: rgba(26, 26, 46, 0.7); }

/* ============= UPLOAD ============= */
.upload-area {
  width: 100%;
  aspect-ratio: 4 / 3;
  background: white;
  border: 4px dashed rgba(26, 26, 46, 0.3);
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transition: border-color 0.2s, background 0.2s;
  padding: 20px;
}

.upload-area:hover { border-color: var(--orange); }

.upload-icon-box {
  width: 64px; height: 64px;
  background: var(--yellow);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s;
}

.upload-area:hover .upload-icon-box { transform: rotate(6deg); }

.upload-area-text { text-align: center; }
.upload-area-text strong { display: block; font-size: 17px; }
.upload-area-text small { color: rgba(26, 26, 46, 0.55); font-size: 13px; }

.preview-wrap {
  position: relative;
  border: 4px solid var(--ink);
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
  background: white;
}

.preview-img {
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  display: block;
}

.preview-remove {
  position: absolute;
  top: 12px; right: 12px;
  background: white;
  border-radius: 50%;
  padding: 8px;
  border: 2px solid var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, color 0.2s;
}

.preview-remove:hover { background: var(--orange); color: white; }

.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.subject-btn {
  padding: 12px 6px;
  border-radius: 16px;
  border: 2px solid rgba(26, 26, 46, 0.2);
  background: white;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.subject-btn-emoji { font-size: 22px; }
.subject-btn-label { font-size: 11px; font-weight: 700; }

.subject-btn:hover { border-color: var(--ink); }

.subject-btn.active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  box-shadow: 3px 3px 0 var(--orange);
}

.error-box {
  background: rgba(255, 107, 53, 0.1);
  border: 2px solid var(--orange);
  border-radius: 16px;
  padding: 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 16px;
  font-size: 14px;
}

/* ============= ANALYSIS ============= */
.analysis-subject-tag {
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 11px;
  color: var(--yellow);
  font-weight: 700;
  margin-bottom: 6px;
}

.analysis-title { font-family: 'Fraunces', serif; font-weight: 800; font-size: 26px; line-height: 1.15; margin-bottom: 10px; position: relative; }

.grade-pill {
  display: inline-block;
  background: var(--bg);
  color: var(--ink);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  position: relative;
}

.motivation-box {
  margin-top: 14px;
  background: rgba(255, 107, 53, 0.18);
  border: 1px solid rgba(255, 107, 53, 0.3);
  border-radius: 16px;
  padding: 12px;
  font-size: 14px;
  font-style: italic;
  position: relative;
}

.wins-box {
  background: rgba(6, 167, 125, 0.1);
  border: 2px solid var(--green);
  border-radius: 22px;
  padding: 18px;
  margin: 18px 0;
}

.wins-list { list-style: none; padding: 0; }
.wins-list li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 4px 0;
  font-size: 15px;
}

.topic-card {
  background: white;
  border: 2px solid rgba(26, 26, 46, 0.1);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 8px;
}

.topic-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.topic-name { font-weight: 700; font-size: 15px; }
.topic-status {
  font-size: 10px;
  font-weight: 800;
  padding: 4px 8px;
  border-radius: 999px;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.status-forte { background: var(--green); color: white; }
.status-medio { background: var(--yellow); color: var(--ink); }
.status-fraco { background: var(--orange); color: white; }

.topic-notes { font-size: 13px; color: rgba(26, 26, 46, 0.7); }

.errors-list { list-style: none; padding: 0; }
.errors-list li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 14px; }
.error-num {
  background: var(--orange);
  color: white;
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}

.tip-box {
  background: var(--yellow);
  border: 4px solid var(--ink);
  border-radius: 22px;
  padding: 18px;
  box-shadow: var(--shadow);
  margin: 18px 0;
}

.tip-box-title { font-family: 'Fraunces', serif; font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }

/* ============= PRACTICE ============= */
.progress-dots {
  display: flex;
  gap: 6px;
}

.dot {
  height: 8px;
  background: rgba(26, 26, 46, 0.2);
  border-radius: 999px;
  width: 8px;
  transition: all 0.3s;
}

.dot.active { width: 32px; background: var(--orange); }
.dot.done { background: var(--green); }

.exercise-card {
  background: white;
  border: 4px solid var(--ink);
  border-radius: 24px;
  padding: 22px;
  box-shadow: var(--shadow);
}

.exercise-tag { text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; color: var(--orange); font-weight: 800; margin-bottom: 8px; }
.exercise-question { font-family: 'Fraunces', serif; font-weight: 800; font-size: 22px; line-height: 1.2; margin-bottom: 14px; }

details.hint-details summary {
  cursor: pointer;
  font-size: 13px;
  color: rgba(26, 26, 46, 0.6);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  list-style: none;
  margin-bottom: 8px;
}

details.hint-details summary::-webkit-details-marker { display: none; }
.hint-text { background: rgba(255, 210, 63, 0.3); padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; }

.answer-textarea {
  width: 100%;
  background: var(--bg);
  border: 2px solid rgba(26, 26, 46, 0.2);
  border-radius: 16px;
  padding: 12px 16px;
  font-size: 16px;
  resize: none;
  outline: none;
  font-family: inherit;
}

.answer-textarea:focus { border-color: var(--orange); }
.answer-textarea:disabled { opacity: 0.6; }

.feedback-box {
  margin-top: 14px;
  padding: 14px;
  border-radius: 16px;
  border: 2px solid;
}

.feedback-correct { background: rgba(6, 167, 125, 0.1); border-color: var(--green); }
.feedback-wrong { background: rgba(255, 107, 53, 0.1); border-color: var(--orange); }

.feedback-header { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 6px; }

.answer-box-dark {
  background: var(--ink);
  color: var(--bg);
  padding: 14px;
  border-radius: 16px;
  margin-top: 10px;
}

.answer-box-dark .label { text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; color: var(--yellow); font-weight: 800; margin-bottom: 4px; }
.answer-box-dark .answer { font-weight: 700; margin-bottom: 6px; }
.answer-box-dark .explanation { font-size: 13px; opacity: 0.85; }

/* ============= PROGRESS ============= */
.progress-bar-wrap {
  height: 12px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  margin: 8px 0 6px;
}

.progress-segment {
  height: 100%;
  transition: width 0.3s;
}

.legend { display: flex; justify-content: space-between; font-size: 11px; color: rgba(26, 26, 46, 0.6); }

/* ============= SETTINGS ============= */
.settings-warning {
  background: rgba(67, 97, 238, 0.08);
  border: 2px solid rgba(67, 97, 238, 0.3);
  border-radius: 16px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.5;
  margin: 16px 0;
}

.settings-warning strong { color: var(--blue); }

.steps-list {
  list-style: none;
  padding: 0;
  margin: 12px 0;
  counter-reset: step;
}

.steps-list li {
  counter-increment: step;
  padding: 8px 0 8px 36px;
  position: relative;
  font-size: 14px;
}

.steps-list li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  top: 8px;
  width: 24px; height: 24px;
  background: var(--orange);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
}

.steps-list a {
  color: var(--blue);
  font-weight: 600;
  text-decoration: underline;
}

/* ============= UTILS ============= */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: rgba(26, 26, 46, 0.6);
  font-size: 14px;
  margin-bottom: 16px;
  padding: 8px 0;
}

.back-btn:hover { color: var(--ink); }

.flex-between { display: flex; justify-content: space-between; align-items: center; }

.mt-4 { margin-top: 16px; }
.mt-6 { margin-top: 24px; }
.mb-2 { margin-bottom: 8px; }

.spacer { height: 16px; }

.loading-analysis {
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  padding: 24px;
}

.loading-icon-box {
  width: 96px; height: 96px;
  background: var(--orange);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  margin-bottom: 20px;
  border: 2px solid var(--ink);
  box-shadow: var(--shadow);
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.bouncing-dots {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 16px;
}

.bouncing-dots span {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--orange);
  animation: bounce 1.4s infinite ease-in-out;
}

.bouncing-dots span:nth-child(2) { background: var(--green); animation-delay: 0.16s; }
.bouncing-dots span:nth-child(3) { background: var(--yellow); animation-delay: 0.32s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

@keyframes fadeIn {

// =========================================================
// OPENROUTER API (free models with vision)
// =========================================================
const MODELS = [
  // Router oficial da OpenRouter para modelos grátis.
  // Ele escolhe automaticamente um modelo grátis que suporte as features pedidas, incluindo imagem.
  { id: 'openrouter/free', label: 'Automático grátis (recomendado)', vision: true },

  // Fallbacks. Estes IDs podem mudar com o tempo; se falharem, o código tenta o próximo.
  { id: 'meta-llama/llama-3.2-11b-vision-instruct:free', label: 'Llama 3.2 Vision grátis', vision: true },
  { id: 'qwen/qwen-2-vl-7b-instruct:free', label: 'Qwen 2 VL grátis', vision: true },
];

const REMOVED_MODEL_IDS = new Set([
  'google/gemini-2.0-flash-exp:free',
]);

function getSafeModelId() {
  if (!state.modelId || REMOVED_MODEL_IDS.has(state.modelId)) return MODELS[0].id;
  return state.modelId;
}

function uniqueModels(list) {
  return [...new Set(list.filter(Boolean).filter(id => !REMOVED_MODEL_IDS.has(id)))];
}

async function callOpenRouter({ prompt, system, image, mimeType }) {
  if (!state.apiKey) throw new Error('Sem API key. Vai a Definições para configurar.');

  const messages = [];
  if (system) messages.push({ role: 'system', content: system });

  if (image) {
    messages.push({
      role: 'user',
      content: [
        { type: 'text', text: prompt },
        { type: 'image_url', image_url: { url: `data:${mimeType || 'image/jpeg'};base64,${image}` } }
      ]
    });
  } else {
    messages.push({ role: 'user', content: prompt });
  }

  const modelsToTry = uniqueModels([
    getSafeModelId(),
    'openrouter/free',
    ...MODELS.map(m => m.id),
  ]);

  let lastError = '';

  for (const model of modelsToTry) {
    const body = {
      model,
      messages,
      temperature: 0.5,
      response_format: { type: 'json_object' }
    };

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.apiKey}`,
      'X-Title': 'Missão Estudo'
    };

    if (location.origin && location.origin !== 'null') {
      headers['HTTP-Referer'] = location.origin;
    }

    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers,
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.text();
      lastError = `Modelo ${model}: Erro ${res.status}: ${err.slice(0, 250)}`;
      console.error('OpenRouter error:', model, res.status, err);

      if (res.status === 401) throw new Error('API key inválida. Verifica nas Definições.');
      if (res.status === 402) throw new Error('Sem créditos/permissão para este modelo. Vai a openrouter.ai e verifica a conta ou usa o modelo automático grátis.');

      // Estes erros podem ser temporários ou específicos do modelo; tenta o próximo fallback.
      if ([400, 404, 408, 429, 500, 502, 503, 504].includes(res.status)) continue;

      throw new Error(lastError);
    }

    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content;
    if (!text) {
      lastError = `Modelo ${model}: resposta vazia da IA.`;
      continue;
    }

    // Parse JSON tolerantly (some models add markdown fences)
    const cleaned = text.replace(/```json\s*/g, '').replace(/```\s*$/g, '').trim();
    try {
      return JSON.parse(cleaned);
    } catch (e) {
      // Try to extract JSON from text
      const match = cleaned.match(/\{[\s\S]*\}/);
      if (match) return JSON.parse(match[0]);
      lastError = `Modelo ${model}: respondeu fora de JSON.`;
    }
  }

  throw new Error(lastError || 'Nenhum modelo disponível neste momento. Tenta novamente dentro de alguns minutos.');
}

function go(view, params = {}) {
  state.view = view;
  Object.assign(state, params);
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function escapeHTML(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('Não consegui ler a imagem'));
    r.readAsDataURL(file);
  });
}

function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function analyzeTest() {
  if (!uploadFile || !uploadSubject) return;
  if (!state.apiKey) {
    uploadError = 'Configura primeiro a API key nas Definições.';
    renderUpload();
    return;
  }

  uploadAnalyzing = true;
  uploadError = null;
  renderUpload();

  try {
    const base64 = await fileToBase64(uploadFile);
    const subLabel = subjectLabel(uploadSubject);

    // Build memory context from past tests
    const memoryContext = buildMemoryContext(uploadSubject);

    const system = `És um tutor amigável de alunos portugueses do 2.º ciclo (10-12 anos). Analisas fotos de testes escolares e identificas pontos fortes e fracos. Respondes SEMPRE e APENAS com um objeto JSON válido, sem texto antes ou depois, sem markdown. Linguagem em português europeu, simples e encorajadora.

${memoryContext}`;

    const prompt = `A disciplina deste teste é: ${subLabel}.

Analisa esta foto do teste do aluno (${state.profile.name}, ${state.profile.year}) e devolve APENAS um JSON com esta estrutura exata:

{
  "subject": "nome da disciplina",
  "title": "título curto motivador (ex: Teste de Frações)",
  "grade_estimate": "nota estimada se visível (ex: 65%, Suficiente) ou null",
  "topics": [
    {"name": "nome do tópico", "status": "forte" ou "medio" ou "fraco", "notes": "comentário breve em 1 frase"}
  ],
  "specific_errors": ["erro 1 em linguagem simples", "erro 2"],
  "wins": ["o que ele acertou bem 1", "o que ele acertou bem 2"],
  "next_focus": ["tópico a praticar 1", "tópico a praticar 2"],
  "tip": "dica de estudo curta motivadora — se tiveres histórico, personaliza-a",
  "motivation": "frase curta de encorajamento (1 frase) — se tiveres histórico, refere a evolução"
}

Se a imagem não for legível ou não for um teste, devolve apenas: {"error": "Não consegui ler bem o teste. Tira nova foto com mais luz e mais perto."}`;

    const parsed = await callOpenRouter({
      prompt,
      system,
      image: base64,
      mimeType: uploadFile.type
    });

    if (parsed.error) {
      uploadError = parsed.error;
      uploadAnalyzing = false;
      renderUpload();
      return;
    }

    const record = {
      id: 'test_' + Date.now(),
      date: new Date().toISOString(),
      subject_id: uploadSubject,
      subject_label: subLabel,
      ...parsed,
    };

    state.history.unshift(record);
    store.set('history', state.history);

    state.profile.xp = (state.profile.xp || 0) + 50;
    store.set('profile', state.profile);

    // Reset upload
    uploadFile = null;
    uploadPreview = null;
    uploadSubject = null;
    uploadAnalyzing = false;

    go('analysis', { currentTest: record });
  } catch (e) {
    console.error(e);
    uploadError = e.message || 'Algo correu mal. Tenta de novo.';
    uploadAnalyzing = false;
    renderUpload();
  }
}

// =========================================================
// MEMORY: build context from past tests
// =========================================================
function buildMemoryContext(subjectId) {
  const past = state.history.filter(t => t.subject_id === subjectId);
  if (past.length === 0) return '';

  // Aggregate weak/strong topics
  const topicStats = {};
  past.forEach(t => {
    (t.topics || []).forEach(tp => {
      if (!topicStats[tp.name]) topicStats[tp.name] = { forte: 0, medio: 0, fraco: 0 };
      topicStats[tp.name][tp.status || 'medio']++;
    });
  });

  const persistent_weak = [];
  const persistent_strong = [];
  Object.entries(topicStats).forEach(([name, s]) => {
    if (s.fraco >= 2) persistent_weak.push(name);
    if (s.forte >= 2 && s.fraco === 0) persistent_strong.push(name);
  });

  // Get common errors
  const allErrors = past.flatMap(t => t.specific_errors || []).slice(0, 8);

  let context = `\nHISTÓRICO DO ALUNO nesta disciplina (${past.length} teste${past.length > 1 ? 's' : ''} anteriore${past.length > 1 ? 's' : ''}):`;

  if (persistent_weak.length > 0) {
    context += `\n- Tópicos com dificuldade recorrente: ${persistent_weak.join(', ')}`;
  }
  if (persistent_strong.length > 0) {
    context += `\n- Pontos fortes consistentes: ${persistent_strong.join(', ')}`;
  }
  if (allErrors.length > 0) {
    context += `\n- Erros frequentes anteriores: ${allErrors.slice(0, 5).join('; ')}`;
  }

  context += `\n\nUsa este histórico para personalizar a análise. Compara com testes anteriores quando relevante. Se o aluno melhorou num tópico, ELOGIA. Se piorou ou continua fraco, recomenda foco aí.`;

  return context;
}

async function checkAnswer() {
  const ex = state.practiceExercises[state.practiceIndex];
  if (!state.practiceAnswer.trim()) return;

  const btn = $('#check-btn');
  btn.innerHTML = `${I.loader} A verificar`;
  btn.disabled = true;

  try {
    const system = `És um professor amigável que avalia respostas de alunos. Responde APENAS em JSON: {"correct": true|false, "feedback": "1-2 frases encorajadoras"}. Português europeu.`;
    const prompt = `Pergunta: ${ex.question}
Resposta correta: ${ex.answer}
Resposta do aluno: ${state.practiceAnswer}

A resposta do aluno está correta (mesmo com palavras diferentes mas significado/valor equivalente)?`;

    const parsed = await callOpenRouter({ prompt, system });
    state.practiceFeedback = parsed;

    if (parsed.correct) {
      state.profile.xp = (state.profile.xp || 0) + 20;

  } catch (e) {
    state.practiceFeedback = { correct: false, feedback: 'Não consegui avaliar. Vê a explicação abaixo para comparar.' };
  }
  renderPractice();
}

      ` : ''}

      ${(!bulkProcessing && totalDone > 0 && totalPending === 0) ? `
        <button class="btn btn-primary mt-4" id="finish-bulk">
          ${I.check} Ver resultados (${totalDone})
        </button>
      ` : ''}
    </div>
  `;

  $('#back').onclick = () => {
    if (bulkProcessing) {
      if (!confirm('A análise vai parar. Tens a certeza?')) return;
    }
    bulkFiles = [];
    bulkProcessing = false;
    bulkDefaultSubject = '';
    go('home');
  };

  // Subject selection
  document.querySelectorAll('.subject-btn').forEach(b => {
    b.onclick = () => {
      if (bulkProcessing) return;
      bulkDefaultSubject = b.dataset.sub;
      // Apply subject to all files
      bulkFiles.forEach(f => { f.subject = bulkDefaultSubject; });
      renderBulk();
    };
  });

  // File input handlers
  const fileInput = $('#bulk-file-input');
  const uploadArea = $('#bulk-upload-area');
  const addMoreBtn = $('#bulk-add-more');

  if (uploadArea) uploadArea.onclick = () => {
    if (!bulkDefaultSubject) return;
    fileInput.click();
  };
  if (addMoreBtn) addMoreBtn.onclick = () => fileInput.click();

  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    for (const f of files) {
      const preview = await fileToDataURL(f);
      bulkFiles.push({
        file: f,
        preview,
        subject: bulkDefaultSubject,
        status: 'pending'
      });
    }
    fileInput.value = ''; // reset so the same files can be re-picked
    renderBulk();
  };

  // Remove file
  document.querySelectorAll('.bulk-remove').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const idx = parseInt(b.dataset.idx);
      bulkFiles.splice(idx, 1);
      renderBulk();
    };
  });

  // Start bulk
  const startBtn = $('#start-bulk');
  if (startBtn) startBtn.onclick = startBulkAnalysis;

  const finishBtn = $('#finish-bulk');
  if (finishBtn) finishBtn.onclick = () => {
    bulkFiles = [];
    bulkProcessing = false;
    bulkDefaultSubject = '';
    go('home');
  };
}

async function startBulkAnalysis() {
  bulkProcessing = true;
  renderBulk();

  for (let i = 0; i < bulkFiles.length; i++) {
    const f = bulkFiles[i];
    if (f.status === 'done') continue;

    f.status = 'processing';
    renderBulk();

    try {
      const base64 = await fileToBase64(f.file);
      const subLabel = subjectLabel(f.subject);
      const memoryContext = buildMemoryContext(f.subject);

      const system = `És um tutor amigável de alunos portugueses do 2.º ciclo (10-12 anos). Analisas fotos de testes escolares e identificas pontos fortes e fracos. Respondes SEMPRE e APENAS com um objeto JSON válido, sem texto antes ou depois, sem markdown. Linguagem em português europeu, simples e encorajadora.

${memoryContext}`;

      const prompt = `A disciplina deste teste é: ${subLabel}. Aluno: ${state.profile.name}, ${state.profile.year}.

Analisa esta foto e devolve APENAS JSON com esta estrutura:

{
  "subject": "nome da disciplina",
  "title": "título curto motivador",
  "grade_estimate": "nota se visível ou null",
  "topics": [{"name": "tópico", "status": "forte"|"medio"|"fraco", "notes": "1 frase"}],
  "specific_errors": ["erro 1", "erro 2"],
  "wins": ["acerto 1", "acerto 2"],
  "next_focus": ["foco 1", "foco 2"],
  "tip": "dica curta",
  "motivation": "encorajamento"
}

Se ilegível: {"error": "Foto pouco nítida."}`;

      const parsed = await callOpenRouter({
        prompt,
        system,
        image: base64,
        mimeType: f.file.type
      });

      if (parsed.error) {
        f.status = 'error';
        f.error = parsed.error;
      } else {
        const record = {
          id: 'test_' + Date.now() + '_' + i,
          date: new Date().toISOString(),
          subject_id: f.subject,
          subject_label: subLabel,
          ...parsed,
        };
        state.history.unshift(record);
        store.set('history', state.history);
        state.profile.xp = (state.profile.xp || 0) + 50;
        store.set('profile', state.profile);
        f.status = 'done';
        f.result = record;
      }
    } catch (e) {
      console.error(e);
      f.status = 'error';
      f.error = e.message;
      // If it's a fatal error (auth), stop the whole batch
      if (e.message && (e.message.includes('inválida') || e.message.includes('créditos'))) {
        bulkProcessing = false;
        renderBulk();
        alert('Erro: ' + e.message + '\n\nA processar parou. Verifica as Definições.');
        return;
      }
    }

    renderBulk();
    // Small delay between requests to avoid rate limits
    await new Promise(r => setTimeout(r, 1500));
  }

  bulkProcessing = false;
  renderBulk();
}


function renderProgress() {
  const { history } = state;
  const bySubject = {};
  history.forEach(t => {
    bySubject[t.subject_label] = (bySubject[t.subject_label] || 0) + 1;
  });

  const topicStats = {};
  history.forEach(t => {
    (t.topics || []).forEach(tp => {
      if (!topicStats[tp.name]) topicStats[tp.name] = { forte: 0, medio: 0, fraco: 0 };
      topicStats[tp.name][tp.status || 'medio']++;
    });
  });

  const sortedTopics = Object.entries(topicStats).sort((a, b) => {
    const at = a[1].forte + a[1].medio + a[1].fraco;
    const bt = b[1].forte + b[1].medio + b[1].fraco;
    return bt - at;
  });

  app().innerHTML = `
    <div class="view">
      <button class="back-btn" id="back">${I.arrow_left} voltar</button>
      <h1 class="display" style="font-size: 34px">Progresso</h1>
      <p style="color: rgba(26,26,46,0.7); margin-top: 4px; margin-bottom: 24px">A tua evolução em números.</p>

      ${history.length === 0 ? `
        <div class="empty-state">
          <div class="empty-emoji">📊</div>
          <p class="empty-text">Adiciona testes para começares a ver o teu progresso.</p>
        </div>
      ` : `
        <h2 class="section-title" style="margin-top:0">Por disciplina</h2>
        ${Object.entries(bySubject).map(([sub, n]) => `
          <div class="card mb-2">
            <div class="flex-between">
              <div style="font-weight:700">${escapeHTML(sub)}</div>
              <div style="color: rgba(26,26,46,0.6); font-size:14px">${n} teste${n > 1 ? 's' : ''}</div>
            </div>
          </div>
        `).join('')}

        ${sortedTopics.length > 0 ? `
          <h2 class="section-title">Tópicos ao longo do tempo</h2>
          ${sortedTopics.map(([topic, s]) => {
            const total = s.forte + s.medio + s.fraco;
            return `
              <div class="card mb-2">
                <div style="font-weight:700; font-size:14px; margin-bottom:4px">${escapeHTML(topic)}</div>
                <div class="progress-bar-wrap">
                  ${s.forte > 0 ? `<div class="progress-segment" style="width:${(s.forte/total)*100}%; background: var(--green)"></div>` : ''}
                  ${s.medio > 0 ? `<div class="progress-segment" style="width:${(s.medio/total)*100}%; background: var(--yellow)"></div>` : ''}
                  ${s.fraco > 0 ? `<div class="progress-segment" style="width:${(s.fraco/total)*100}%; background: var(--orange)"></div>` : ''}
                </div>
                <div class="legend">
                  <span>✨ ${s.forte} forte</span>
                  <span>⚡ ${s.medio} a melhorar</span>
                  <span>🎯 ${s.fraco} foco</span>
                </div>
              </div>
            `;
          }).join('')}
        ` : ''}
      `}
    </div>
  `;

  $('#back').onclick = () => go('home');
}

// =========================================================
// VIEW: SETTINGS (incl. API key setup)
// =========================================================
function renderSettings(firstTime = false) {
  let tempKey = state.apiKey || '';
  let tempModel = getSafeModelId();

  app().innerHTML = `
    <div class="view">
      <button class="back-btn" id="back">${I.arrow_left} ${firstTime ? 'voltar' : 'voltar'}</button>
      <h1 class="display" style="font-size: 32px">Definições</h1>

      <h2 class="section-title">${I.key} API Key do OpenRouter</h2>
      <div class="settings-warning">
        <strong>Porque é preciso?</strong> A análise dos testes usa a OpenRouter — uma plataforma que dá acesso grátis a vários modelos de IA com visão. Tens de obter uma chave grátis (demora 1 minuto). A chave fica guardada só no teu browser.
      </div>

      <ol class="steps-list">
        <li>Vai a <a href="https://openrouter.ai/sign-up" target="_blank" rel="noopener">openrouter.ai/sign-up</a></li>
        <li>Cria conta com Google ou email (não pede cartão)</li>
        <li>Vai a <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener">openrouter.ai/settings/keys</a></li>
        <li>Clica em <strong>"Create Key"</strong>, dá-lhe um nome (ex: "Missão Estudo")</li>
        <li>Copia a chave (começa por "sk-or-...")</li>
        <li>Cola aqui em baixo</li>
      </ol>

      <input class="input-field" id="key-input" placeholder="sk-or-..." value="${escapeHTML(tempKey)}" autocomplete="off" />

      <h2 class="section-title" style="margin-top:24px">Modelo de IA</h2>
      <p style="color: rgba(26,26,46,0.7); font-size: 14px; margin-bottom: 12px">Se um modelo não funcionar (limite atingido, indisponível), muda para outro.</p>
      <select class="input-field" id="model-select">
        ${MODELS.map(m => `<option value="${m.id}" ${m.id === tempModel ? 'selected' : ''}>${m.label}</option>`).join('')}
      </select>

      <button class="btn btn-green mt-4" id="save-key">${I.check} Guardar</button>

      <div id="key-status" style="margin-top:12px; font-size:14px; text-align:center"></div>

      ${!firstTime && state.profile ? `
        <h2 class="section-title">Perfil</h2>
        <div class="card mb-2">
          <div style="font-size:13px; color: rgba(26,26,46,0.6)">Nome</div>
          <div style="font-weight:700; font-size:17px">${escapeHTML(state.profile.name)}</div>
        </div>
        <div class="card mb-2">
          <div style="font-size:13px; color: rgba(26,26,46,0.6)">Ano</div>
          <div style="font-weight:700; font-size:17px">${escapeHTML(state.profile.year)}</div>
        </div>

        <h2 class="section-title">Dados</h2>
        <button class="danger-btn" id="reset-btn">${I.trash} Apagar tudo (reset)</button>
      ` : ''}
    </div>
  `;

  $('#back').onclick = () => {
    if (firstTime && !state.apiKey) {
      $('#key-status').innerHTML = '<span style="color: var(--orange)">⚠ Precisas de uma API key para a IA funcionar.</span>';
      setTimeout(() => {
        if (state.profile) go('home');
      }, 1500);
    } else {
      go('home');
    }
  };

  $('#key-input').oninput = (e) => { tempKey = e.target.value.trim(); };
  $('#model-select').onchange = (e) => { tempModel = e.target.value; };
  $('#save-key').onclick = () => {
    if (!tempKey || !tempKey.startsWith('sk-or-')) {
      $('#key-status').innerHTML = '<span style="color: var(--orange)">A chave parece inválida (deve começar por "sk-or-")</span>';
      return;
    }
    state.apiKey = tempKey;
    state.modelId = tempModel;
    store.set('apiKey', tempKey);
    store.set('modelId', tempModel);
    $('#key-status').innerHTML = '<span style="color: var(--green)">✓ Guardado!</span>';
    setTimeout(() => {
      if (firstTime) go('home');
    }, 800);
  };

  const resetBtn = $('#reset-btn');
  if (resetBtn) resetBtn.onclick = () => {
    if (confirm('Tens a certeza? Vais apagar todos os testes e o perfil. Esta ação não se desfaz.')) {
      store.clear();
      state.profile = null;
      state.history = [];
      state.apiKey = null;
      state.modelId = null;
      location.reload();
    }
  };
}

// =========================================================
// ROUTER
// =========================================================
function render() {
  if (!state.profile) {
    renderOnboarding();
    return;
  }
  switch (state.view) {
    case 'home': renderHome(); break;
    case 'upload': renderUpload(); break;
    case 'bulk': renderBulk(); break;
    case 'analysis': renderAnalysis(); break;
    case 'practice': renderPractice(); break;
    case 'progress': renderProgress(); break;
    case 'settings': renderSettings(state.firstTime || false); state.firstTime = false; break;
    default: renderHome();
  }
}

// =========================================================
// INIT
// =========================================================
(function init() {
  state.profile = store.get('profile');
  state.history = store.get('history') || [];
  state.apiKey = store.get('apiKey');
  state.modelId = store.get('modelId');
  if (REMOVED_MODEL_IDS.has(state.modelId)) {
    state.modelId = MODELS[0].id;
    store.set('modelId', state.modelId);
  }
  render();
})();
</script>
